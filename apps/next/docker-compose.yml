version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gift_user
      POSTGRES_PASSWORD: gift_password
      POSTGRES_DB: gift_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gift_user -d gift_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

